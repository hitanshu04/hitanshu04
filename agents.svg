    .loop { animation: loopdash 2.4s linear infinite; }
    @keyframes loopdash { from { stroke-dashoffset:0; } to { stroke-dashoffset:-44; } }
    @media (prefers-reduced-motion: reduce) { .edge,.flow,.node,.loop { animation:none; } }
